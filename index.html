<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#a51f1f"><meta name="description" content="Cardápio e pedidos da Pizzaria e Esfiharia Paulista. Monte seu pedido e finalize pelo WhatsApp."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E"><title>Paulista – Pizzaria e Esfiharia · Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8a24a;--ink:#fff3ea;--mute:#e0b8aa;--card:#150404;--dk:#2b0707;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body.lock{overflow:hidden}
body{margin:0;font:15px/1.4 'DM Sans',system-ui,sans-serif;color:var(--ink);background:#3a0909 linear-gradient(180deg,#a51f1f 0,#5c0e0e 40%,#220505 100%) fixed;min-height:100vh;min-height:100dvh}
#app{max-width:520px;margin:0 auto;padding:14px 14px 110px}
h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:600;margin:0}
header{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.lg{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
h1{font-size:21px;line-height:1.1}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
#sr{width:100%;border:0;border-radius:999px;padding:12px 18px;font:inherit;background:#fff;color:#2b0707}
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:6px 0 4px;background:linear-gradient(#a51f1f,#a51f1fee 70%,#a51f1f00);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs:empty{display:none}
.tb{flex:none;border:1px solid #ffffff55;background:transparent;color:var(--ink);border-radius:999px;padding:7px 15px;font:inherit;font-size:13px;cursor:pointer}
.tb.on{background:var(--gold);color:var(--dk);border-color:var(--gold);font-weight:700}
section{margin-top:14px}
.ban{height:104px;border-radius:18px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px 14px;margin-bottom:10px}
.ban h2{font-size:22px;text-shadow:0 2px 8px #000}.ban{box-shadow:inset 0 -60px 50px -20px #260404}
.h{font-size:19px;margin:6px 2px 8px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.it b{display:block;font-weight:700}.it small{color:var(--mute);display:block;font-size:12.5px}
.pr{text-align:right;flex:none;font-weight:700;display:flex;align-items:center;gap:10px}.pr small{color:var(--mute);font-weight:400}
.ad{width:34px;height:34px;border-radius:50%;border:0;background:var(--gold);color:var(--dk);font-size:22px;line-height:1;font-weight:700;cursor:pointer}
.half{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#c52a2a,#7d1212);border:1px solid #ffffff44;border-radius:18px;padding:12px 14px;margin-top:6px;cursor:pointer}
.half b{font-family:Fredoka,sans-serif;font-size:18px;display:block}.half span{color:#ffd9cc;font-size:13px}
[data-act],button,.c,.ad{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:#ffffff40}.pix code{user-select:all;-webkit-user-select:all}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(492px,calc(100% - 28px));border:0;border-radius:999px;padding:15px 22px;background:var(--gold);color:var(--dk);font:700 16px 'DM Sans',system-ui,sans-serif;display:flex;justify-content:space-between;cursor:pointer;box-shadow:0 8px 24px #0009;z-index:6}
#bar[hidden]{display:none}
#sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#box{width:100%;max-width:520px;max-height:93vh;max-height:93dvh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#7a1414,#2a0707 35%);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){#box{animation:none}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:#ffffff22;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
h4{font:600 15px Fredoka,sans-serif;margin:16px 0 8px;color:#ffd9b0}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.c{border:1px solid #ffffff44;background:#00000040;color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.c.on{background:var(--gold);color:var(--dk);border-color:var(--gold);font-weight:700}
.pz{display:block;margin:6px auto}
.pks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{height:210px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;position:relative;background:#00000040;border-radius:14px;padding:4px}
.pk button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 8px;border-radius:10px;font:inherit;font-size:13px;scroll-snap-align:center;cursor:pointer}
.pk button em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.pk button.on{background:var(--gold);color:var(--dk);font-weight:700}.pk button.on em{color:var(--dk)}
.pt{text-align:center;font:600 16px Fredoka,sans-serif;min-height:22px}
textarea,.fi{width:100%;border:0;border-radius:12px;padding:11px 13px;font:inherit;background:#fff;color:#2b0707}
textarea{min-height:56px;resize:vertical}
#sr,textarea,.fi{font-size:16px}
.fr{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}
.go{width:100%;border:0;border-radius:999px;padding:15px;background:var(--gold);color:var(--dk);font:700 16px 'DM Sans',system-ui,sans-serif;cursor:pointer;margin-top:16px}
.go.ln{background:transparent;color:var(--ink);border:1px solid #ffffff55;margin-top:8px}
.qt{display:inline-flex;align-items:center;gap:12px;background:#00000050;border-radius:999px;padding:3px}
.qt button{width:32px;height:32px;border-radius:50%;border:0;background:var(--gold);color:var(--dk);font-size:18px;font-weight:700;cursor:pointer}
.ci{display:flex;gap:10px;justify-content:space-between;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.ci small{display:block;color:var(--mute);font-size:12.5px}.ci .r{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.tot{display:flex;justify-content:space-between;padding:3px 2px}.tot.big{font:600 20px Fredoka,sans-serif;margin-top:6px}
.err{background:#fff;color:#a01212;border-radius:10px;padding:9px 12px;margin-top:10px;font-weight:500}
.msg{white-space:pre-wrap;background:var(--card);border-radius:14px;padding:14px;font-size:13.5px;margin:0;max-height:36vh;overflow:auto}
.pix{background:#0f3d1e;border:1px solid #2fa85a;border-radius:14px;padding:12px 14px;margin-top:12px}.pix code{font-size:17px;font-weight:700;word-break:break-all}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:var(--dk);padding:9px 18px;border-radius:999px;font-weight:700;z-index:30;display:none;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
footer{margin-top:22px;text-align:center;color:var(--mute);font-size:12.5px}
</style></head><body>
